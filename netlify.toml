# ============================================================================
# BUSCADOR MAX — configuração de deploy no Netlify
# ============================================================================

[build]
  command = "rm -rf .next .netlify && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--no-audit --no-fund"

  # Evita falso positivo do scanner de segredos no cache do Next/Turbopack
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**,.next/**"
